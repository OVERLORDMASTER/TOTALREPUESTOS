<header>
    <h2 class="header-title">Inventario de Productos</h2>
    <div class="header-actions inventario-actions">
        <div class="desktop-tools">
            <button class="action-btn btn-cat" data-modal-target="modalCategoria">Categorias de Productos</button>
            <button class="action-btn btn-add" data-modal-target="modalProducto">Cargar Producto</button>
            <button class="action-btn btn-del inventory-tool-btn inventory-delete-btn" id="btnEliminar">Eliminar</button>
            <button class="action-btn btn-edit inventory-tool-btn inventory-edit-btn" id="btnEditar">Editar</button>
            <button class="action-btn btn-purple inventory-tool-btn inventory-print-btn" id="btnPrintInventory" data-modal-target="modalOpcionesInventarioPDF">Imprimir Lista de Inventario</button>
        </div>

        <details class="tools-dropdown">
            <summary class="action-btn btn-blue">Herramientas</summary>
            <div class="tools-menu">
                <button class="action-btn btn-cat" data-modal-target="modalCategoria">Categorías</button>
                <button class="action-btn btn-add" data-modal-target="modalProducto">Cargar producto</button>
                <button class="action-btn btn-del inventory-tool-btn inventory-delete-btn">Eliminar</button>
                <button class="action-btn btn-edit inventory-tool-btn inventory-edit-btn">Editar</button>
                <button class="action-btn btn-purple inventory-tool-btn inventory-print-btn" data-modal-target="modalOpcionesInventarioPDF">Imprimir Inventario</button>
            </div>
        </details>

        <input type="text" id="productSearch" placeholder="Buscar producto...">
    </div>
</header>
<div class="content-area">
    <div id="productsContainer"></div>
</div>
<footer>
    <div class="total-item"><span class="total-label">total invertido $ (bcv):</span><span class="total-value" id="totalInvertido" style="color: var(--btn-green);">$ 0.00</span></div>
    <div class="total-item"><span class="total-label">total invertido $ (efectivo):</span><span class="total-value" id="totalInvertidoEfectivo" style="color: var(--btn-orange);">$ 0.00</span></div>
    <div class="total-item"><span class="total-label">total invertido bs (bcv):</span><span class="total-value" id="totalInvertidoBs" style="color: var(--text-primary);">Bs 0.00</span></div>
    <div class="total-item"><span class="total-label">stock total:</span><span class="total-value" id="stockTotal">0</span></div>
</footer>

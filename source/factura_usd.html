<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="factura.css">
</head>
<body>

<div class="invoice-container">
    <div class="header">
        <div class="logo-section">
            <img src="/imagen/logo.png" alt="TOTAL REPUESTOS C&S Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <div id="logo-fallback" style="display:none; font-weight:bold; font-size:16px; border:2px dashed #999; border-radius:6px; padding:10px;">[ LOGO ]</div>
            <div class="company-info">
                UBICACIÓN : Carrera 28 entre calles 44 y 45.<br>
                NRO CELULAR : 0424-5436998<br>
                INSTAGRAM : @totalrepuestosc
            </div>
        </div>
        <div class="title-section" style="text-align: right;">
            <div style="font-weight: bold; font-size: 13.5px; margin-bottom: 6px; color: #2c3e50; text-transform: uppercase; letter-spacing: 0.5px;">NOTA DE ENTREGA</div>
            <div>
                <input type="text" class="note-number-input" id="noteNumber">
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="field-group" style="flex: 2;">
            <label>ID :</label>
            <input type="text" id="invoiceId">
        </div>
        <div class="field-group" style="flex: 2;">
            <label>FECHA :</label>
            <input type="datetime-local" id="fechaHora">
        </div>
    </div>

    <div class="form-row">
        <div class="field-group" style="flex: 3;">
            <label>NOMBRE DEL CLIENTE :</label>
            <input type="text" id="nombreCliente">
        </div>
        <div class="field-group" style="flex: 2;">
            <label>VENDEDOR :</label>
            <input type="text" id="vendedor">
        </div>
    </div>

    <div class="form-row">
        <div class="field-group" style="flex: 3;">
            <label>DIRECCIÓN :</label>
            <input type="text" id="direccion">
        </div>
        <div class="field-group" style="flex: 2;">
            <label>CÉDULA :</label>
            <input type="text" id="cedula">
        </div>
    </div>

    <div class="form-row">
        <div class="field-group" style="flex: 0 0 170px;">
            <label>GARANTÍA :</label>
            <input type="text" id="garantia">
        </div>
        <div class="field-group" style="flex: 1;" id="tipoPagoContainer">
            <label>MÉTODOS DE PAGO :</label>
            <input type="text" id="tipoPago">
        </div>
    </div>

    <div class="table-responsive">
        <table id="itemsTable">
            <thead>
                <tr>
                    <th style="width: 10%;">CÓDIGO</th>
                    <th style="width: 33%;">DESCRIPCIÓN</th>
                    <th style="width: 12%;">MARCA</th>
                    <th style="width: 7%;">UNDS</th>
                    <th style="width: 14%;">PRECIO UNITARIO $</th>
                    <th style="width: 14%;">SUBTOTAL $</th>
                    <th class="no-print" style="width: 10%;">ACCIÓN</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Las filas se generan dinámicamente -->
            </tbody>
        </table>
    </div>

    <div class="no-print" style="margin-bottom: 20px;">
        <!-- Los botones de agregar/limpiar no son necesarios para el PDF generado -->
    </div>

    <div class="footer-section">
        <div class="totals-box">
            <div class="total-field">
                <span>TOTAL $ EFECTIVO:</span>
                <input type="text" id="totalUSD" value="0.00" readonly>
            </div>
        </div>

        <div class="actions">
            <!-- El botón de imprimir es manejado por el iframe, no es necesario aquí -->
        </div>
    </div>
</div>

<!-- No se necesita el script de la factura manual para el PDF generado -->

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Inventario</title>
    <link rel="stylesheet" href="inventario_pdf.css">
</head>
<body>
<div class="invoice-container">
    <div class="header">
        <div class="logo-section">
            <img src="/imagen/logo.png" alt="TOTAL REPUESTOS C&S Logo">
            <div class="company-info">
                UBICACIÓN : Carrera 28 entre calles 44 y 45.<br>
                NRO CELULAR : 0424-5436998<br>
                INSTAGRAM : @totalrepuestosc
            </div>
        </div>
        <div class="title-section">
            <h1>LISTA DE INVENTARIO</h1>
        </div>
    </div>

    <div class="summary-info">
        <div><strong>Fecha de Impresión:</strong> <span id="fechaImpresion"></span></div>
        <div><strong>Total de Productos (SKU):</strong> <span id="totalProductos"></span></div>
        <div><strong>Total de Unidades:</strong> <span id="totalUnidades"></span></div>
    </div>

    <div class="table-responsive">
        <table id="itemsTable">
            <thead>
                <tr>
                    <th style="width: 20%;">CÓDIGO</th>
                    <th style="width: 50%;">PRODUCTO</th>
                    <th style="width: 15%;">CANTIDAD</th>
                    <th style="width: 15%;">VERIFICADO</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Inventario</title>
    <link rel="stylesheet" href="inventario_pdf.css">
</head>
<body>

<div class="invoice-container">
    <div class="header">
        <div class="logo-section">
            <img src="/imagen/logo.png" alt="TOTAL REPUESTOS C&S Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <div id="logo-fallback" style="display:none; font-weight:bold; font-size:16px; border:2px dashed #999; border-radius:6px; padding:10px;">[ LOGO ]</div>
            <div class="company-info">
                UBICACIÓN : Carrera 28 entre calles 44 y 45.<br>
                NRO CELULAR : 0424-5436998<br>
                INSTAGRAM : @totalrepuestosc
            </div>
        </div>
        <div class="title-section" style="text-align: right;">
            <div id="pdfHeaderTitle" style="font-weight: bold; font-size: 13.5px; margin-bottom: 6px; color: #2c3e50; text-transform: uppercase; letter-spacing: 0.5px;">LISTA DE INVENTARIO</div>
        </div>
    </div>

    <div class="form-row">
        <div class="field-group" style="flex: 1.8;">
            <label>FECHA :</label>
            <input type="text" id="fechaImpresion" readonly>
        </div>
        <div class="field-group" style="flex: 2.2;">
            <label>TIPO :</label>
            <input type="text" id="tipoReporte" readonly style="font-weight: 700; color: #1e293b;">
        </div>
        <div class="field-group" style="flex: 1.1;">
            <label>SKU :</label>
            <input type="text" id="totalProductos" readonly style="font-weight: bold; text-align: center;">
        </div>
        <div class="field-group" style="flex: 1.1;">
            <label>UNIDADES :</label>
            <input type="text" id="totalUnidades" readonly style="font-weight: bold; text-align: center;">
        </div>
    </div>

    <div class="table-responsive">
        <table id="itemsTable">
            <colgroup>
                <col class="col-codigo" style="width: 14%;">
                <col class="col-producto" style="width: 38%;">
                <col class="col-cantidad" style="width: 12%;">
                <col class="col-costo" style="width: 12%;">
                <col class="col-venta" style="width: 12%;">
                <col class="col-verificado" style="width: 12%;">
            </colgroup>
            <thead>
                <tr>
                    <th class="col-codigo" style="width: 14%;">CÓDIGO</th>
                    <th class="col-producto" style="width: 38%;">PRODUCTO</th>
                    <th class="col-cantidad" style="width: 12%;">CANTIDAD</th>
                    <th class="col-costo" style="width: 12%;">COSTO ($)</th>
                    <th class="col-venta" style="width: 12%;">VENTA ($)</th>
                    <th class="col-verificado" style="width: 12%;">VERIFICADO</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

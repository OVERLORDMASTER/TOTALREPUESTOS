<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Automático con Sonido</title>
    <style>
        /* Reseteo básico para ocupar toda la pantalla */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal que ocupa toda la ventana */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video de fondo a pantalla completa */
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que cubra toda la pantalla sin deformarse */
            z-index: 1;
        }

        /* Capa opcional de texto superpuesto */
        .content-overlay {
            position: relative;
            z-index: 2;
            color: #fff;
            text-align: center;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* Permite hacer clic a través del texto si fuera necesario */
        }

        .content-overlay h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .content-overlay p {
            font-size: 1.2rem;
        }

        /* Estilos para el overlay de login */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #333;
        }

        #login-form {
            background: #fff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        #login-form h2 {
            margin-bottom: 20px;
        }

        #login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #login-form button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 
          Atributos clave:
          - autoplay: Inicia la reproducción sola.
          - controls: Muestra los controles por si el navegador bloquea el autoplay con sonido.
          - loop: Opcional, repite el video infinitamente.
          - playsinline: Necesario para dispositivos móviles.
        -->
        <video id="bg-video" muted controls loop playsinline>
            <source src="assets/video.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>

        <!-- Opcional: Texto encima del video -->
        <div class="content-overlay">
            <h1>Bienvenidos</h1>
            <p>pura bendicion</p>
        </div>
    </div>

    <!-- Overlay de Login -->
    <div id="login-overlay">
        <form id="login-form">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        // Seleccionar los elementos del DOM
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const video = document.getElementById('bg-video');

        // Añadir un evento al formulario
        loginForm.addEventListener('submit', function(event) {
            // Prevenir el comportamiento por defecto del formulario (recargar la página)
            event.preventDefault();

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            // Verificar las credenciales
            if (usernameInput === 'user' && passwordInput === '1234') {
                // Si son correctas, ocultar el login y reproducir el video
                loginOverlay.style.display = 'none';
                video.play();
            } else {
                // Si son incorrectas, mostrar una alerta
                alert('Usuario o contraseña incorrectos.');
            }
        });
    </script>
</body>
</html>
